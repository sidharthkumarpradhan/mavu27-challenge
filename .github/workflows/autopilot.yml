# Unattended ReVA loop. Twice an hour: leaderboard snapshot, poll open submissions, collect a finished
# Kaggle job, submit the best gated run, push the next queued lanes, update STATUS.md on the
# `state` branch. See src/reva/autopilot.py.
#
# Fully automatic by default (owner's instruction, 6 Oct 2026). Kill switches in Settings > Secrets
# and variables > Actions > Variables:
#   AUTOPILOT=off      stops the loop
#   AUTO_SUBMIT=off    keeps the loop running but stops Codabench submissions
# Secrets: KAGGLE_USERNAME, KAGGLE_KEY (GPU jobs), optional KAGGLE_USERNAME_NEW, KAGGLE_KEY_NEW (second
# Kaggle account, takes jobs when the first is out of weekly GPU quota), CODABENCH_USERNAME, CODABENCH_PASSWORD
# (submissions and scores). Optional: ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN turns on the
# headless Claude Code fixer for failed jobs, as in the EURS loop.
# Scheduled runs fire from the default branch; the job always checks out main.
# GitHub had not fired the schedule once by 7 Oct 2026, so while a Kaggle job runs or a submission
# is being scored, the job runs a cycle about every 20 minutes for up to 4 hours, then starts the
# next job itself. A dispatch made with GITHUB_TOKEN is one of the two events that may start a new
# run (GitHub docs). The dispatch API answered HTTP 500 for 8 minutes straight on 7 Oct 2026, so the
# loop calls it a few times a day instead of every 20 minutes. A job ends early when main moves, so
# the push run of a merged change takes over within minutes.
name: autopilot

on:
  schedule:
    - cron: "23,53 * * * *"  # off the top of the hour, when GitHub delays scheduled runs most
  push:  # a merged code, config or queue change starts a cycle at once instead of at the next hour
    branches: [main]
    paths: ["configs/**", "src/**", ".github/workflows/autopilot.yml"]
  workflow_dispatch:

concurrency:
  group: autopilot
  cancel-in-progress: false

permissions:
  actions: write  # the next cycle
  contents: write
  issues: write

jobs:
  cycle:
    if: vars.AUTOPILOT != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 330  # 4 h of cycles, the last wait and cycle, and the dispatch retries
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_USERNAME_NEW: ${{ secrets.KAGGLE_USERNAME_NEW }}  # second account, used when the first is out of GPU quota
      KAGGLE_KEY_NEW: ${{ secrets.KAGGLE_KEY_NEW }}
      CODABENCH_USERNAME: ${{ secrets.CODABENCH_USERNAME }}
      CODABENCH_PASSWORD: ${{ secrets.CODABENCH_PASSWORD }}
      AUTO_SUBMIT: ${{ vars.AUTO_SUBMIT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # only merged code drives GPU jobs and submissions, whichever branch fired
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (no torch, the cycle only orchestrates)
        run: python -m pip install -q -e ".[remote,dev]"

      - name: Kaggle credentials
        run: |
          test -n "$KAGGLE_USERNAME" && test -n "$KAGGLE_KEY" || { echo "KAGGLE_USERNAME/KAGGLE_KEY not set"; exit 1; }
          mkdir -p ~/.kaggle
          key=$(printf %s "$KAGGLE_KEY" | tr -d '[:space:]')
          # the key may be the classic 32-char key or a new "KGAT..." token (seen in the EURS loop)
          if [[ $key == KGAT* ]]; then
            printf %s "$key" > ~/.kaggle/access_token; chmod 600 ~/.kaggle/access_token
            echo "KAGGLE_API_TOKEN=$key" >> "$GITHUB_ENV"
          else
            python -c "import json,os,sys; json.dump({'username': os.environ['KAGGLE_USERNAME'].strip(), 'key': sys.argv[1]}, open(os.path.expanduser('~/.kaggle/kaggle.json'), 'w'))" "$key"
            chmod 600 ~/.kaggle/kaggle.json
          fi

      - name: Tests (a red suite collects and reports, but pushes no new GPU job)
        id: tests
        continue-on-error: true
        run: python -m pytest -q

      - name: State branch
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch -q origin state
            git worktree add -B state state origin/state
          else
            git worktree add --orphan -b state state
          fi

      - name: Cycles (about 20 minutes apart while a job or a submission is open)
        run: |
          nopush=""; [ "${{ steps.tests.outcome }}" = "success" ] || nopush="--no-push"
          git config --global user.name "Sidharth Pradhan"
          git config --global user.email "sidharthp@assignall.ai"
          started=$(date +%s); crashed=0
          while :; do
            rm -f outcome.json
            # the Colab workflow commits its runs to the state branch while this loop waits; read them
            # before the cycle, or a finished Colab run waits a whole cycle to be seen (9 Oct 2026)
            git -C state pull -q --rebase origin state || { git -C state rebase --abort || true; }
            python -m reva.cli autopilot --state state --work work/autopilot --sha "$(git rev-parse HEAD)" \
              --outcome outcome.json $nopush || crashed=1
            # save state
            if [ -f state/STATUS.md ]; then
              cat state/STATUS.md >> "$GITHUB_STEP_SUMMARY"
              ( cd state
                for f in STATUS.md board.csv runs.jsonl jobs.jsonl submissions.jsonl blocked.jsonl arena.json dev_clean.json active.json; do
                  [ -f "$f" ] && git add -- "$f"
                done
                git add -u -- .
                # the Colab workflow pushes to the same branch (its own files), so rebase first
                git diff --cached --quiet || { git commit -q -m "autopilot: state at $(date -u +%Y-%m-%dT%H:%MZ)" \
                  && { git pull -q --rebase origin state || { git rebase --abort || true; }; } && git push -q origin state; }
              ) || echo "::warning::state push failed; the next cycle pushes it again"
            fi

            # issue on a failed job
            if [ -f outcome.json ]; then
              python - <<'PY' || echo "::warning::could not open an issue for the failed job"
          import json, subprocess
          out = json.load(open("outcome.json"))
          if out.get("needs_fix"):
              runs = ", ".join(out["collected"])
              body = "Failed lanes in the last job: " + runs + "\n\nLog tail:\n```\n" + out.get("log_tail", "")[-6000:] + "\n```"
              subprocess.run(["gh", "issue", "create", "--title", f"Autopilot job failed: {runs}", "--body", body], check=True)
          PY
            fi

            COLAB='${{ vars.COLAB }}' bash .github/autopilot/start_colab.sh || true  # every cycle, not after 4 h

            # a cycle that crashed before writing its outcome keeps cycling, as the schedule would
            if [ -f outcome.json ] && ! python -c "import json,sys; sys.exit(0 if json.load(open('outcome.json')).get('waiting') else 1)"; then
              echo "nothing open; the next push or schedule starts the loop"; touch idle; break
            fi
            if [ $(( $(date +%s) - started )) -ge 14400 ]; then break; fi  # 4 h; the next job carries on
            for i in $(seq 20); do  # wait 20 minutes, but hand over at once when main moves
              sleep 60
              main=$(git ls-remote origin refs/heads/main | cut -f1)  # empty when GitHub is unreachable
              if [ -n "$main" ] && [ "$main" != "$(git rev-parse HEAD)" ]; then
                echo "main moved; the next job runs the new code"; break 2
              fi
            done
          done
          exit $crashed

      - name: Fix a failed job (headless Claude Code, only when its secret is set)
        if: always() && (env.ANTHROPIC_API_KEY != '' || env.CLAUDE_CODE_OAUTH_TOKEN != '')
        run: |
          [ -f outcome.json ] || exit 0
          python -c "import json,sys; sys.exit(0 if json.load(open('outcome.json'))['needs_fix'] else 1)" || { echo "nothing to fix"; exit 0; }
          npm install -g @anthropic-ai/claude-code
          mkdir -p ~/.claude && echo '{"includeCoAuthoredBy": false}' > ~/.claude/settings.json
          git config user.name "Sidharth Pradhan"
          git config user.email "sidharthp@assignall.ai"
          claude -p "$(cat .github/autopilot/fix_prompt.md)" --allowedTools "Bash,Read,Edit,Write,Glob,Grep" --permission-mode dontAsk

      - name: Start the next job while a job or a submission is open
        if: always()
        run: |
          if [ -f idle ]; then echo "nothing open; no next job"; exit 0; fi
          # also when main moved: a docs-only merge starts no push run (see the paths filter)
          # one HTTP 500 from the dispatch API broke the chain for an hour (7 Oct 2026), so retry
          for wait in 0 30 60 120 240; do
            sleep "$wait"
            gh workflow run autopilot.yml --ref main --repo "$GITHUB_REPOSITORY" && exit 0  # no checkout needed
          done
          exit 1
