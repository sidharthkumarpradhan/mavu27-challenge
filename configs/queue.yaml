# Experiments, run in this order. Each entry is a name, a reason, and dotted overrides on
# configs/competition.yaml. The run id is the name plus a hash of the config (minus the keys
# in reva.config.ORCHESTRATION, which do not change predictions), so editing an entry makes it a
# new run, and a finished run is never repeated. A job takes the first
# `remote.lanes` pending entries (one per T4). Append; do not reorder finished entries.
#
# Order follows the playbook: measure first (baseline, timing, a probe), then build. Training
# sizes itself to the session (reva.job.train_deadline), so entries do not set sample counts.
# Kaggle gives about 30 GPU hours a week, so about 2.5 jobs (5 lanes) a week until Nov 10.

# job 1: baseline and probe
- name: zs-4b
  why: zero-shot Qwen3-VL-4B, 16 frames. Baseline, T4 seconds per question, first submission (confirms the format)
  set: {}
  # ran on 6 Oct as zs-4b-6254e8de, before the run id left out orchestration. Only the av pin
  # changed since (av>=14 instead of ==19.0.1), which decodes the same frames.
  done_as: {zs-4b-5c05120c: zs-4b-6254e8de}

- name: text-4b
  why: text-only probe. How much the options alone give away (paper's text-only result is 29.95%)
  set: {model.use_video: false, infer.skip_test: true}
  done_as: {text-4b-08bf53bf: text-4b-f571bdb5}

# job 2: does fine-tuning pay, and does the bigger backbone
- name: ft-4b-16f
  why: LoRA fine-tune of Qwen3-VL-4B on 16 frames, sized to the session. The paper's +6.5 points came from fine-tuning
  set: {train.enabled: true}

- name: zs-8b-4bit
  why: zero-shot Qwen3-VL-8B in 4-bit. Does the bigger backbone pay for its speed on a T4
  set: {model.id: Qwen/Qwen3-VL-8B-Instruct, model.load_4bit: true}

# From job 3 on, every run scores all 4 cyclic option shifts (infer.perms: 4). With the video
# encoded once per video (#21) that costs a few short passes per question, and it cancels any
# letter-position bias.
# job 3: more frames, and a newer backbone. Qwen3.5-4B reports VideoMME 76.9 and MVBench 71.2 on its
# model card (read 8 Oct 2026), above Qwen3-VL-8B, and fits a T4 in fp16 where the 8B needs 4-bit.
# Its chat template opens a <think> block unless enable_thinking is false. Three of its four layers
# are linear attention (in_proj_qkv, in_proj_z, out_proj), so LoRA targets those too.
- name: ft-4b-32f
  why: LoRA fine-tune of Qwen3-VL-4B on 32 frames (the paper's frame count). Temporal tasks are the weakest on the board
  set: {train.enabled: true, frames.n: 32, infer.perms: 4}

- name: ft-q35-4b-16f
  why: LoRA fine-tune of Qwen3.5-4B, 16 frames. Newer backbone with higher video benchmark scores, and a different model for the arena
  set: {model.id: Qwen/Qwen3.5-4B, model.chat_template_kwargs: {enable_thinking: false}, train.enabled: true, infer.perms: 4,
        train.lora_targets: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj|in_proj_qkv|in_proj_z|out_proj)'}

# job 4
- name: ft-8b-4bit-16f
  why: QLoRA fine-tune of Qwen3-VL-8B, 16 frames
  set: {model.id: Qwen/Qwen3-VL-8B-Instruct, model.load_4bit: true, train.enabled: true, infer.perms: 4}
