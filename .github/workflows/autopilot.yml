# Unattended ReVA loop. Twice an hour: leaderboard snapshot, poll open submissions, collect a finished
# Kaggle job, submit the best gated run, push the next queued lanes, update STATUS.md on the
# `state` branch. See src/reva/autopilot.py.
#
# Fully automatic by default (owner's instruction, 6 Oct 2026). Kill switches in Settings > Secrets
# and variables > Actions > Variables:
#   AUTOPILOT=off      stops the loop
#   AUTO_SUBMIT=off    keeps the loop running but stops Codabench submissions
# Secrets: KAGGLE_USERNAME, KAGGLE_KEY (GPU jobs), CODABENCH_USERNAME, CODABENCH_PASSWORD
# (submissions and scores). Optional: ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN turns on the
# headless Claude Code fixer for failed jobs, as in the EURS loop.
# Scheduled runs fire from the default branch; the job always checks out main.
name: autopilot

on:
  schedule:
    - cron: "23,53 * * * *"  # off the top of the hour, when GitHub delays scheduled runs most
  push:  # a merged code, config or queue change starts a cycle at once instead of at the next hour
    branches: [main]
    paths: ["configs/**", "src/**", ".github/workflows/autopilot.yml"]
  workflow_dispatch:

concurrency:
  group: autopilot
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  cycle:
    if: vars.AUTOPILOT != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      CODABENCH_USERNAME: ${{ secrets.CODABENCH_USERNAME }}
      CODABENCH_PASSWORD: ${{ secrets.CODABENCH_PASSWORD }}
      AUTO_SUBMIT: ${{ vars.AUTO_SUBMIT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # only merged code drives GPU jobs and submissions, whichever branch fired
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (no torch, the cycle only orchestrates)
        run: python -m pip install -q -e ".[remote,dev]"

      - name: Kaggle credentials
        run: |
          test -n "$KAGGLE_USERNAME" && test -n "$KAGGLE_KEY" || { echo "KAGGLE_USERNAME/KAGGLE_KEY not set"; exit 1; }
          mkdir -p ~/.kaggle
          key=$(printf %s "$KAGGLE_KEY" | tr -d '[:space:]')
          # the key may be the classic 32-char key or a new "KGAT..." token (seen in the EURS loop)
          if [[ $key == KGAT* ]]; then
            printf %s "$key" > ~/.kaggle/access_token; chmod 600 ~/.kaggle/access_token
            echo "KAGGLE_API_TOKEN=$key" >> "$GITHUB_ENV"
          else
            python -c "import json,os,sys; json.dump({'username': os.environ['KAGGLE_USERNAME'].strip(), 'key': sys.argv[1]}, open(os.path.expanduser('~/.kaggle/kaggle.json'), 'w'))" "$key"
            chmod 600 ~/.kaggle/kaggle.json
          fi

      - name: Tests (a red suite collects and reports, but pushes no new GPU job)
        id: tests
        continue-on-error: true
        run: python -m pytest -q

      - name: State branch
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch -q origin state
            git worktree add -B state state origin/state
          else
            git worktree add --orphan -b state state
          fi

      - name: Cycle
        run: |
          nopush=""; [ "${{ steps.tests.outcome }}" = "success" ] || nopush="--no-push"
          python -m reva.cli autopilot --state state --work work/autopilot --sha "$(git rev-parse HEAD)" --outcome outcome.json $nopush
          cat state/STATUS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save state
        if: always()
        run: |
          cd state
          [ -f STATUS.md ] || exit 0
          git config user.name "Sidharth Pradhan"
          git config user.email "sidharthp@assignall.ai"
          for f in STATUS.md board.csv runs.jsonl jobs.jsonl submissions.jsonl blocked.jsonl arena.json active.json; do
            [ -f "$f" ] && git add -- "$f"
          done
          git add -u -- .
          git diff --cached --quiet && exit 0
          git commit -q -m "autopilot: state at $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin state

      - name: Issue on a failed job
        if: always()
        run: |
          [ -f outcome.json ] || exit 0
          python - <<'PY'
          import json, subprocess
          out = json.load(open("outcome.json"))
          if not out.get("needs_fix"):
              raise SystemExit(0)
          runs = ", ".join(out["collected"])
          body = "Failed lanes in the last job: " + runs + "\n\nLog tail:\n```\n" + out.get("log_tail", "")[-6000:] + "\n```"
          subprocess.run(["gh", "issue", "create", "--title", f"Autopilot job failed: {runs}", "--body", body], check=True)
          PY

      - name: Fix a failed job (headless Claude Code, only when its secret is set)
        if: always() && (env.ANTHROPIC_API_KEY != '' || env.CLAUDE_CODE_OAUTH_TOKEN != '')
        run: |
          [ -f outcome.json ] || exit 0
          python -c "import json,sys; sys.exit(0 if json.load(open('outcome.json'))['needs_fix'] else 1)" || { echo "nothing to fix"; exit 0; }
          npm install -g @anthropic-ai/claude-code
          mkdir -p ~/.claude && echo '{"includeCoAuthoredBy": false}' > ~/.claude/settings.json
          git config user.name "Sidharth Pradhan"
          git config user.email "sidharthp@assignall.ai"
          claude -p "$(cat .github/autopilot/fix_prompt.md)" --allowedTools "Bash,Read,Edit,Write,Glob,Grep" --permission-mode dontAsk
