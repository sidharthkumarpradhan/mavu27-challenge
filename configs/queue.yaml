# Experiments, run in this order. Each entry is a name, a reason, and dotted overrides on
# configs/competition.yaml. The run id is the name plus a hash of the full config, so editing an
# entry makes it a new run, and a finished run is never repeated. A job takes the first
# `remote.lanes` pending entries (one per T4). Append; do not reorder finished entries.
#
# Order follows the playbook: measure first (baseline, timing, a probe), then build. Training
# sizes itself to the session (reva.job.train_deadline), so entries do not set sample counts.
# Kaggle gives about 30 GPU hours a week, so about 2.5 jobs (5 lanes) a week until Nov 10.

# job 1: baseline and probe
- name: zs-4b
  why: zero-shot Qwen3-VL-4B, 16 frames. Baseline, T4 seconds per question, first submission (confirms the format)
  set: {}

- name: text-4b
  why: text-only probe. How much the options alone give away (paper's text-only result is 29.95%)
  set: {model.use_video: false, infer.skip_test: true}

# job 2: does fine-tuning pay, and does the bigger backbone
- name: ft-4b-16f
  why: LoRA fine-tune of Qwen3-VL-4B on 16 frames, sized to the session. The paper's +6.5 points came from fine-tuning
  set: {train.enabled: true}

- name: zs-8b-4bit
  why: zero-shot Qwen3-VL-8B in 4-bit. Does the bigger backbone pay for its speed on a T4
  set: {model.id: Qwen/Qwen3-VL-8B-Instruct, model.load_4bit: true}

# job 3: scale the winner along the two cheap axes
- name: ft-8b-4bit-16f
  why: QLoRA fine-tune of Qwen3-VL-8B, 16 frames
  set: {model.id: Qwen/Qwen3-VL-8B-Instruct, model.load_4bit: true, train.enabled: true}

- name: ft-4b-32f
  why: LoRA fine-tune of Qwen3-VL-4B on 32 frames (the paper's frame count). Temporal tasks are the weakest on the board
  set: {train.enabled: true, frames.n: 32}
