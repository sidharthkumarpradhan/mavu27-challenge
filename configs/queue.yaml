# Experiments, run in this order. Each entry is a name, a reason, and dotted overrides on
# configs/competition.yaml. The run id is the name plus a hash of the config (minus the keys
# in reva.config.ORCHESTRATION, which do not change predictions), so editing an entry makes it a
# new run, and a finished run is never repeated. A job takes the first
# `remote.lanes` pending entries (one per T4). Append; do not reorder finished entries.
#
# Order follows the playbook: measure first (baseline, timing, a probe), then build. Training
# sizes itself to the session (reva.job.train_deadline), so entries do not set sample counts.
# Kaggle gives about 30 GPU hours a week, so about 2.5 jobs (5 lanes) a week until Nov 10.

# job 1: baseline and probe
- name: zs-4b
  why: zero-shot Qwen3-VL-4B, 16 frames. Baseline, T4 seconds per question, first submission (confirms the format)
  set: {}
  # ran on 6 Oct as zs-4b-6254e8de, before the run id left out orchestration. Only the av pin
  # changed since (av>=14 instead of ==19.0.1), which decodes the same frames.
  done_as: {zs-4b-5c05120c: zs-4b-6254e8de}

- name: text-4b
  why: text-only probe. How much the options alone give away (paper's text-only result is 29.95%)
  set: {model.use_video: false, infer.skip_test: true}
  done_as: {text-4b-08bf53bf: text-4b-f571bdb5}

# job 2: does fine-tuning pay, and does the bigger backbone
- name: ft-4b-16f
  why: LoRA fine-tune of Qwen3-VL-4B on 16 frames, sized to the session. The paper's +6.5 points came from fine-tuning
  set: {train.enabled: true}

- name: zs-8b-4bit
  why: zero-shot Qwen3-VL-8B in 4-bit. Does the bigger backbone pay for its speed on a T4
  set: {model.id: Qwen/Qwen3-VL-8B-Instruct, model.load_4bit: true}

# From job 3 on, every run scores all 4 cyclic option shifts (infer.perms: 4). With the video
# encoded once per video (#21) that costs a few short passes per question, and it cancels any
# letter-position bias.
# job 3: more frames, and a newer backbone. Qwen3.5-4B reports VideoMME 76.9 and MVBench 71.2 on its
# model card (read 8 Oct 2026), above Qwen3-VL-8B, and fits a T4 in fp16 where the 8B needs 4-bit.
# Its chat template opens a <think> block unless enable_thinking is false. Three of its four layers
# are linear attention (in_proj_qkv, in_proj_z, out_proj), so LoRA targets those too.
# ft-4b-32f (ft-4b-32f-527078f0) left the queue on 8 Oct 2026 without a result: in a 6.8 h session its
# inference alone needed 6.0 h. ft-4b-32f-1ep below is the same experiment, trained across sessions.

# job 4
- name: ft-8b-4bit-16f
  why: QLoRA fine-tune of Qwen3-VL-8B, 16 frames
  set: {model.id: Qwen/Qwen3-VL-8B-Instruct, model.load_4bit: true, train.enabled: true, infer.perms: 4}
# job 5 on (8 Oct 2026): ft-8b-4bit-16f trained on a third of an epoch (5,318 samples in a session
# sized to fit inference) and moved the board from 0.7410 to 0.8125. Fine-tunes now train a full
# epoch across sessions (train.span_sessions): each session trains to its end and checkpoints, the
# autopilot archives the state and the next session resumes it, and only the last one runs
# inference. At about 3.3 s per sample the 8B needs about 13 h of training, so 2 to 3 sessions.
# Held on 10 Oct 2026 (owner): no training until the local evidence says it can win. The
# three Kaggle entries below go back only with a written hypothesis and expected dev score.
# ft-8b-4bit-16f-1ep was stopped mid-epoch (step 712 of 1,686 saved in its run dataset).
# - name: ft-8b-4bit-16f-1ep
#   why: the job 4 QLoRA of Qwen3-VL-8B trained on a full epoch across sessions instead of a third of one
#   set: {model.id: Qwen/Qwen3-VL-8B-Instruct, model.load_4bit: true, train.enabled: true, infer.perms: 4,
#         train.span_sessions: true}
# - name: ft-4b-32f-1ep
#   why: LoRA of Qwen3-VL-4B on 32 frames for a full epoch across sessions. 32 frames give 16 timestamps instead of 8 for Temporal Grounding, our weakest task
#   set: {train.enabled: true, frames.n: 32, infer.perms: 4, train.span_sessions: true}
# Moved behind the full-epoch runs (8 Oct 2026): Qwen3.5 has linear-attention layers, so it cannot
# pack questions and trains one question at a time, and its fp16 speed on a T4 is unmeasured. A
# speculative arena member should not take a lane from the runs that move the board.
# - name: ft-q35-4b-16f
#   why: LoRA fine-tune of Qwen3.5-4B, 16 frames. Newer backbone with higher video benchmark scores, and a different model for the arena
#   set: {model.id: Qwen/Qwen3.5-4B, model.chat_template_kwargs: {enable_thinking: false}, train.enabled: true, infer.perms: 4,
#         train.lora_targets: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj|in_proj_qkv|in_proj_z|out_proj)'}
# Colab Pro (8 Oct 2026, reva.colab): one A100 session at a time, run by .github/workflows/colab.yml.
# An A100 has bf16 and 40 GB or more, so the 8B trains in full precision with 32 frames (16
# timestamps for Temporal Grounding), where a T4 needs 4-bit and 16 frames. Sessions last about
# 5 h, so the run spans sessions like the Kaggle full-epoch runs.
- name: ft-8b-32f-a100
  why: Qwen3-VL-8B in bf16 on a Colab A100, 32 frames, a full epoch. The strongest model the compute allows, aimed at Temporal Grounding
  backend: colab
  gpu: A100
  set: {model.id: Qwen/Qwen3-VL-8B-Instruct, model.dtype: bf16, train.enabled: true, frames.n: 32, infer.perms: 4,
        train.span_sessions: true}
# Next Colab entry (9 Oct 2026). ft-8b-32f-a100 scored 0.821 weighted on dev, +0.0035 over the
# submitted 8B; the leader is 6.7 points above our board score, more than frames or epochs have
# moved us. Model scale is the lever left. Probe before spending the units on a fine-tune: the
# 32B zero-shot under the same setup as zs-8b-4bit (16 frames, no option shifts), which scored
# 0.744. About 2-3 A100 hours. If it beats zs-8b-4bit by a wide margin, a 32B QLoRA comes next.
- name: zs-32b-4bit-a100
  why: zero-shot Qwen3-VL-32B in 4-bit on a Colab A100, set up like zs-8b-4bit. A ceiling probe before a 32B fine-tune
  backend: colab
  gpu: A100
  set: {model.id: Qwen/Qwen3-VL-32B-Instruct, model.load_4bit: true, model.dtype: bf16}
# zs-32b-4bit-a100 scored 0.768 weighted dev against 0.744 for zs-8b-4bit under the same setup
# (9 Oct 2026), so scale pays. Fine-tuning moved the 8B from 0.744 to 0.821; the same on the 32B is
# the run that can close the gap to the leader. 16 frames to keep a full epoch within the
# remaining units; the final session the units allow stops training in time to predict.
- name: ft-32b-4bit-a100
  why: QLoRA of Qwen3-VL-32B on a Colab A100, 16 frames, a full epoch across sessions. Its zero-shot beat the 8B's by 2.4 points
  backend: colab
  gpu: A100
  set: {model.id: Qwen/Qwen3-VL-32B-Instruct, model.load_4bit: true, model.dtype: bf16, train.enabled: true, infer.perms: 4,
        train.span_sessions: true}
