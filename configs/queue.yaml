# Experiments, run in this order. Each entry is a name, a reason, and dotted overrides on
# configs/competition.yaml. The run id is the name plus a hash of the full config, so editing an
# entry makes it a new run, and a finished run is never repeated. A job takes the first
# `remote.lanes` pending entries (one per T4). Append; do not reorder finished entries.
#
# Order follows the playbook: measure first (baseline, timing, a probe), then build.

- name: zs-4b
  why: zero-shot Qwen3-VL-4B, 16 frames. Baseline, T4 seconds per question, first submission (confirms the format)
  set: {}

- name: text-4b
  why: text-only probe. How much the options alone give away (paper's text-only result is 29.95%)
  set: {model.use_video: false, infer.skip_test: true}

- name: ft-4b-8f
  why: first LoRA fine-tune, 8 frames and 6,000 samples to fit one session. The paper's +6.5 points came from fine-tuning
  set: {train.enabled: true, frames.n: 8, train.max_samples: 6000, train.max_hours: 7.5}

- name: zs-8b-4bit
  why: zero-shot Qwen3-VL-8B in 4-bit. Does the bigger backbone pay for its speed on a T4
  set: {model.id: Qwen/Qwen3-VL-8B-Instruct, model.load_4bit: true}
